<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Tube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <nav>
            <div class="logo">
                <img src="Images/You Tube Image.jpg" alt="Youtube Logo">
            </div>
            <div class="center-nav">
                <div class="search">
                    <input type="text">
                    <button>
                        <img src="Icons/SearchIcon.png" alt="search">
                    </button>
                </div>
                <div class="mic">
                    <img src="Icons/Mic.png" alt="mic">
                </div>

                </div>
                <div class="side-nav">
                    <i>
                    <img src="Images/video+.jpg" alt="video">
                    </i>
                    <i>
                    <img src="Images/dot grid.png" alt="grid">
                    </i>
                    <i>
                     <img src="Images/bell.png" alt="bell">
                    </i>
                    <i>
                    <img src="Images/Avtar.png" alt="avtar">
                    </i>
                </div>
                <div class="tags">
                    <div class="tag dark">All</div>
                    <div class="tag light">Mixes</div>
                    <div class="tag light">Crypto</div>
                    <div class="tag light">Html</div>
                    <div class="tag light">CSS</div>
                    <div class="tag light">Javascript</div>
                </div>
            </div>
        </nav>
    </header>
    <aside>
        <div class="bars">
            <img src="Icons/bars.png" alt="bars">
        </div>
        <div class="side-icons">
            <i>
                <img src="/Icons/Home.png" alt="home">
            </i>
            <p>Home</p>
        </div>
        <div class="side-icons">
            <i>
                <img src="/Icons/Compass.png" alt="explore">
            </i>
            <p>Explore</p>
        </div>
        <div class="side-icons">
            <i>
                <img src="/Icons/Video-Gallery" alt="gallery">
            </i>
            <p>Subscription</p>
        </div>
        <div class="side-icons">
            <i>
                <img src="/Icons/Video-Library.png" alt="Libraray">
            </i>
            <p>Library</p>
        </div>
    </aside>
</body>
</html>
